<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App</title>
    <!-- Скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            width: 88%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .avatar-box {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        p.sub {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }
        .online-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 10px 20px;
            border-radius: 100px;
            color: #10b981;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 12px #10b981;
            animation: pulse 1.5s infinite;
        }
        .count {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 5px 0 10px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-box">🚀</div>
        <h1 id="username">Игрок</h1>
        <p class="sub">Тестовый режим Mini App</p>

        <div class="online-badge">
            <div class="dot"></div>
            <span>Сейчас в приложении</span>
        </div>

        <div class="count" id="online-count">...</div>
    </div>

    <!-- Подключение Firebase и логики онлайна -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
        import { getDatabase, ref, onValue, push, onDisconnect, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Выводим имя пользователя из Telegram, если открыто внутри ТГ
        const user = tg.initDataUnsafe?.user;
        if (user && user.first_name) {
            document.getElementById('username').innerText = user.first_name;
        }

        // Твой конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBZ8Qm4BeX6U1vCMNb-_FgNBp0OQUkC-9k",
            authDomain: "tetete-d31c8.firebaseapp.com",
            databaseURL: "https://tetete-d31c8-default-rtdb.firebaseio.com",
            projectId: "tetete-d31c8",
            storageBucket: "tetete-d31c8.firebasestorage.app",
            messagingSenderId: "130781376435",
            appId: "1:130781376435:web:8588052eb0f36ce99fe5c6",
            measurementId: "G-B9J1GPPJZF"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // Ссылки на ветки БД
        const onlineListRef = ref(db, 'online_users');
        const connectedRef = ref(db, '.info/connected');

        // Отслеживание подключения клиента
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                // Создаем уникальную запись для текущей сессии
                const mySessionRef = push(onlineListRef);
                
                // Когда вкладка/аппка закроется — запись сама удалится из БД
                onDisconnect(mySessionRef).remove();
                
                // Записываем данные о входе
                set(mySessionRef, {
                    user_id: user?.id || "guest",
                    name: user?.first_name || "Guest",
                    joined_at: serverTimestamp()
                });
            }
        });

        // Считаем количество записей в ветке online_users в реальном времени
        onValue(onlineListRef, (snap) => {
            const count = snap.exists() ? Object.keys(snap.val()).length : 0;
            document.getElementById('online-count').innerText = count;
        });
    </script>
</body>
</html>
