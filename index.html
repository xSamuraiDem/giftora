<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GIFT UPGRADER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#181c27;--line:#262b3a;--gold:#ffb21e;--orange:#ff6b00;--blue:#4b69ff;--purple:#8847ff;--pink:#d32ce6;--red:#eb4b4b;--text:#eef1f8;--muted:#7d869c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Rajdhani',-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),radial-gradient(circle at 50% -10%,rgba(255,107,0,.22),transparent 60%);background-size:28px 28px,28px 28px,100% 100%}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(11,13,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:15px;letter-spacing:1px}
.logo b{color:var(--orange)}
.pill{display:flex;align-items:center;gap:7px;padding:6px 12px;background:var(--panel2);border:1px solid var(--line);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);font-weight:700;font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:#2ee66b;box-shadow:0 0 8px #2ee66b;animation:p 1.5s infinite}
.bal{color:var(--gold);cursor:pointer}
.wrap{flex:1;padding:18px 16px 30px;display:flex;flex-direction:column;justify-content:center}
.screen{display:none;animation:in .25s ease}.screen.active{display:block}
.card{position:relative;background:var(--panel);border:1px solid var(--line);padding:24px 18px;margin-bottom:14px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink),var(--red),var(--gold))}
.hero{width:76px;height:76px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(135deg,var(--orange),#c43c00);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:0 0 30px rgba(255,107,0,.4)}
h1{font-family:Orbitron,sans-serif;font-size:20px;text-align:center;letter-spacing:1px;margin-bottom:6px}
h1 b{color:var(--orange)}
.sub{text-align:center;color:var(--muted);font-size:15px;line-height:1.35;margin-bottom:18px;font-weight:500}
.inp{width:100%;background:#0a0c11;border:1.5px solid var(--line);color:#fff;padding:14px;font:700 17px Rajdhani,sans-serif;text-align:center;outline:none;margin-bottom:12px;transition:.2s}
.inp:focus{border-color:var(--orange);box-shadow:0 0 14px rgba(255,107,0,.3)}
.code{letter-spacing:10px;font:900 26px Orbitron,sans-serif;color:var(--gold)}
.btn{width:100%;border:none;padding:14px;color:#fff;font:700 17px Rajdhani,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,#ff8a00,#e04800);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 6px 20px rgba(255,107,0,.35);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;pointer-events:none}
.btn.ghost{background:var(--panel2);box-shadow:none;color:var(--muted);margin-top:10px}
.err{color:var(--red);font-size:14px;text-align:center;min-height:18px;margin-bottom:10px;font-weight:600}
.ok{color:var(--gold)}
.avatar{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;padding:3px;background:conic-gradient(var(--blue),var(--purple),var(--pink),var(--red),var(--gold),var(--blue));box-shadow:0 0 28px rgba(136,71,255,.35)}
.avatar>div{width:100%;height:100%;border-radius:50%;background:var(--panel2);overflow:hidden;display:flex;align-items:center;justify-content:center;font:900 38px Orbitron,sans-serif;color:var(--orange)}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-family:Orbitron,sans-serif;font-size:18px;text-align:center}
.handle{text-align:center;color:var(--muted);font-weight:600;margin:2px 0 6px}
.badge{display:table;margin:0 auto 14px;padding:3px 12px;background:rgba(46,230,107,.1);border:1px solid rgba(46,230,107,.4);color:#2ee66b;font-size:13px;font-weight:700;letter-spacing:1px}
.balbox{background:linear-gradient(135deg,rgba(255,178,30,.14),rgba(255,107,0,.05));border:1px solid rgba(255,178,30,.4);padding:14px;text-align:center;margin-bottom:12px}
.balbox small{display:block;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.balbox span{font:900 30px Orbitron,sans-serif;color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);padding:11px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.stat b{font-size:16px;color:var(--text)}
.sec{font-family:Orbitron,sans-serif;font-size:13px;color:var(--orange);letter-spacing:1px;margin:18px 0 10px;text-align:center}
.shop{background:var(--panel2);border:1.5px solid var(--line);border-bottom:3px solid var(--c);padding:14px 8px;text-align:center;cursor:pointer;transition:.15s}
.shop:active{transform:scale(.96);background:#1f2433}
.shop .e{font-size:24px}.shop .s{font:900 17px Orbitron,sans-serif;color:var(--gold);margin:4px 0}
.shop .t{font-size:12px;font-weight:700;color:var(--c);letter-spacing:1px}
.hidden{display:none}
@keyframes p{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="top">
  <div class="logo">GIFT <b>UPGRADER</b></div>
  <div style="display:flex;gap:8px">
    <div class="pill"><div class="dot"></div><span id="online">1</span></div>
    <div class="pill bal hidden" id="topBal">⭐ <span id="topStars">0</span></div>
  </div>
</div>

<div class="wrap">

  <!-- Проверка "я не робот" -->
  <div class="screen active" id="s-start">
    <div class="card">
      <div class="hero">🤖</div>
      <h1>ПРОВЕРКА <b>ВХОДА</b></h1>
      <p class="sub">Подтверди, что ты не робот. Мы отправим 6-значный код в Telegram-бота.</p>
      <div class="err" id="e1"></div>
      <button class="btn" id="getCode">Получить код</button>
    </div>
  </div>

  <div class="screen" id="s-code">
    <div class="card">
      <div class="hero">🔐</div>
      <h1>ВВЕДИ <b>КОД</b></h1>
      <p class="sub">Бот отправил тебе 6 цифр. Введи их ниже.</p>
      <div class="err" id="e2"></div>
      <input class="inp code" id="code" placeholder="000000" maxlength="6" inputmode="numeric">
      <button class="btn" id="verify">Подтвердить</button>
      <button class="btn ghost" id="back">Назад</button>
    </div>
  </div>

  <!-- Профиль -->
  <div class="screen" id="s-profile">
    <div class="card">
      <div class="avatar"><div id="avatar">?</div></div>
      <div class="name" id="pName">Player</div>
      <div class="handle" id="pHandle"></div>
      <div class="badge">✔ ВЕРИФИЦИРОВАН</div>

      <div class="balbox"><small>Баланс</small><span>⭐ <span id="pStars">0</span></span></div>

      <div class="grid">
        <div class="stat"><small>Telegram ID</small><b id="pId">—</b></div>
        <div class="stat"><small>Дата входа</small><b id="pDate">—</b></div>
      </div>

      <div class="sec">ПОПОЛНИТЬ БАЛАНС</div>
      <div class="grid" style="margin-bottom:12px">
        <div class="shop" style="--c:#4b69ff" data-s="15"><div class="e">⭐</div><div class="s">15</div><div class="t">STARS</div></div>
        <div class="shop" style="--c:#8847ff" data-s="50"><div class="e">🌟</div><div class="s">50</div><div class="t">STARS</div></div>
        <div class="shop" style="--c:#d32ce6" data-s="100"><div class="e">✨</div><div class="s">100</div><div class="t">STARS</div></div>
        <div class="shop" style="--c:#eb4b4b" data-s="250"><div class="e">🔥</div><div class="s">250</div><div class="t">STARS</div></div>
      </div>
      <input class="inp" id="custom" type="number" min="1" max="10000" placeholder="Своя сумма Stars...">
      <button class="btn" id="buyCustom">Пополнить ⭐</button>
      <div class="err ok" id="shopStatus" style="margin:10px 0 0"></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, onDisconnect, set, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();
try { tg.setHeaderColor('#0b0d12'); tg.setBackgroundColor('#0b0d12'); } catch(e){}

const tgUser = tg.initDataUnsafe?.user;
let uid = tgUser?.id ? String(tgUser.id) : localStorage.getItem('test_tg_id');
if (!uid) { uid = "guest_" + Math.floor(100000 + Math.random()*900000); localStorage.setItem('test_tg_id', uid); }
const isGuest = uid.startsWith("guest_");
const $ = id => document.getElementById(id);

const app = initializeApp({
  apiKey: "AIzaSyBZ8Qm4BeX6U1vCMNb-_FgNBp0OQUkC-9k",
  authDomain: "tetete-d31c8.firebaseapp.com",
  databaseURL: "https://tetete-d31c8-default-rtdb.firebaseio.com",
  projectId: "tetete-d31c8",
  storageBucket: "tetete-d31c8.firebasestorage.app",
  messagingSenderId: "130781376435",
  appId: "1:130781376435:web:8588052eb0f36ce99fe5c6"
});
const db = getDatabase(app);

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

// Онлайн
const onlineRef = ref(db,'online_users');
onValue(ref(db,'.info/connected'), s=>{
  if (s.val()===true){ const r=push(onlineRef); onDisconnect(r).remove(); set(r,{user_id:uid,ts:Date.now()}); }
});
onValue(onlineRef, s=>{ $('online').innerText = s.exists()? Object.keys(s.val()).length : 1; });

// Данные Telegram для профиля
const fullName = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : 'Guest';
const handle = tgUser?.username ? '@'+tgUser.username : '';
function renderAvatar(){
  const box = $('avatar');
  if (tgUser?.photo_url){
    const img = new Image(); img.src = tgUser.photo_url;
    img.onload = ()=>{ box.innerHTML=''; box.appendChild(img); };
    box.innerText = (fullName[0]||'?').toUpperCase();
  } else box.innerText = (fullName[0]||'?').toUpperCase();
}
renderAvatar();
$('pName').innerText = fullName;
$('pHandle').innerText = handle;
$('pId').innerText = uid;

// Профиль в реальном времени (баланс обновляет бот после оплаты)
const userRef = ref(db,`users/${uid}`);
onValue(userRef, s=>{
  if (!s.exists()) return;
  const d = s.val();
  const st = d.stars || 0;
  $('topStars').innerText = st; $('pStars').innerText = st;
  if (d.verified){
    $('topBal').classList.remove('hidden');
    $('pDate').innerText = d.registered_date || 'Сегодня';
    if (['s-start','s-code'].includes(document.querySelector('.screen.active')?.id)) show('s-profile');
  }
});

// Запрос кода
$('getCode').onclick = async ()=>{
  $('e1').innerText = '';
  if (isGuest){ $('e1').innerText = 'Открой приложение внутри Telegram через бота!'; return; }
  const b = $('getCode'); b.disabled = true; b.innerText = 'Отправляем...';
  try {
    await set(ref(db,`auth_requests/${uid}`), {
      username: tgUser?.username || fullName, status:'pending', created_at: Date.now()
    });
    show('s-code');
  } catch(e){ $('e1').innerText = 'Ошибка сети, попробуй ещё раз'; }
  b.disabled = false; b.innerText = 'Получить код';
};

// Проверка кода
$('verify').onclick = async ()=>{
  const entered = $('code').value.trim(); $('e2').innerText = '';
  if (entered.length !== 6){ $('e2').innerText = 'Введи ровно 6 цифр!'; return; }
  const reqRef = ref(db,`auth_requests/${uid}`);
  const snap = await get(reqRef);
  if (!snap.exists() || !snap.val().code){ $('e2').innerText = 'Код ещё не пришёл. Подожди пару секунд.'; return; }
  if (String(snap.val().code) === entered){
    const us = await get(userRef);
    const stars = us.exists() ? (us.val().stars||0) : 0;
    await set(userRef, {
      username: tgUser?.username || fullName, name: fullName, verified:true,
      stars, registered_date: us.exists() && us.val().registered_date ? us.val().registered_date : new Date().toLocaleDateString('ru-RU')
    });
    await update(reqRef,{status:'verified'});
    show('s-profile');
  } else $('e2').innerText = '❌ Неверный код!';
};
$('back').onclick = ()=>show('s-start');

// Пополнение Stars
async function buy(amount){
  const st = $('shopStatus');
  if (isGuest){ st.innerText='Оплата работает только внутри Telegram!'; return; }
  st.innerText = `⏳ Создаём счёт на ${amount} ⭐...`;
  const invRef = ref(db,`invoice_requests/${uid}`);
  await set(invRef,{amount:Number(amount),status:'pending',ts:Date.now()});
  const unsub = onValue(invRef, s=>{
    const d = s.val();
    if (d?.status==='ready' && d.invoice_url){
      unsub(); st.innerText='';
      tg.openInvoice(d.invoice_url, r=>{
        if (r==='paid') st.innerText = `✅ Оплачено! +${amount} ⭐ скоро появятся на балансе`;
        else if (r==='cancelled') st.innerText = 'Оплата отменена.';
        else if (r==='failed') st.innerText = 'Ошибка оплаты.';
      });
    }
  });
}
document.querySelectorAll('.shop').forEach(i=>i.onclick=()=>buy(parseInt(i.dataset.s,10)));
$('buyCustom').onclick = ()=>{
  const v = parseInt($('custom').value,10);
  if (!v || v<1 || v>10000){ $('shopStatus').innerText='Введи сумму от 1 до 10000 ⭐'; return; }
  buy(v);
};
$('topBal').onclick = ()=>show('s-profile');
</script>
</body>
</html>
